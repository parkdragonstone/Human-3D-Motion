services:
  human-3d-motion-cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    image: human-3d-motion:cpu
    container_name: human-3d-motion-cpu
    profiles: ["cpu"]
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      HUMAN_3D_MOTION_HTTPS: "${HUMAN_3D_MOTION_HTTPS:-0}"
      HUMAN_3D_MOTION_HOST: "0.0.0.0"
      HUMAN_3D_MOTION_PORT: "5000"
      HUMAN_3D_MOTION_PUBLIC_URL: "${HUMAN_3D_MOTION_PUBLIC_URL:-}"
      HUMAN_3D_MOTION_STORAGE: "/app/recordings"
    volumes:
      - ${HUMAN_3D_MOTION_RECORDINGS_HOST:-../recordings}:/app/recordings
      - ../webapp_data:/app/webapp_data
      - ../pipelines/models:/app/pipelines/models:ro

  human-3d-motion-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: human-3d-motion:gpu
    container_name: human-3d-motion-gpu
    profiles: ["gpu"]
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      HUMAN_3D_MOTION_HTTPS: "${HUMAN_3D_MOTION_HTTPS:-0}"
      HUMAN_3D_MOTION_HOST: "0.0.0.0"
      HUMAN_3D_MOTION_PORT: "5000"
      HUMAN_3D_MOTION_PUBLIC_URL: "${HUMAN_3D_MOTION_PUBLIC_URL:-}"
      HUMAN_3D_MOTION_STORAGE: "/app/recordings"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HUMAN_3D_MOTION_RECORDINGS_HOST:-../recordings}:/app/recordings
      - ../webapp_data:/app/webapp_data
      - ../pipelines/models:/app/pipelines/models:ro
