# OpenSim + PoseProgram pip 의존성 한 번에 설치
# conda env create -f environment.yml && conda activate baseball-motion
name: baseball-motion
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - flask>=3.0.0
      - flask-socketio>=5.3.0
      - "qrcode[pil]>=7.4.0"
      - pyopenssl>=23.0.0
      - numpy>=1.24.0
      - scipy>=1.11.0
      - ultralytics>=8.0.0
      - rtmlib>=0.0.13
      - opencv-python>=4.12.0.0
      - onnxruntime>=1.23.0
      - openvino>=2025.0.0
      - pandas>=2.2.0
      - lxml>=5.0.0
      - opensim>=4.6
